[project]
name = "demo"
version = "0.1.0"
description = "Examples of PINNs implemented in PyTorch and Tensorflow"
readme = "README.md"
requires-python = "==3.10.*"
dependencies = [
    "torch==2.*",
    "nvidia-cuda-nvcc-cu12==12.*",
    "numpy<2",
    "plotly==6.0.1",
    "tqdm==4.67.1",
    "watermark",
    "torch-summary",
    "matplotlib",
    "ipywidgets",
    "notebook",
    "ipykernel>=6.30.0",
    "keras==3.12.4",
    "tensorflow[and-cuda]==2.19",
    "pyDOE==0.3.8",
    "mlflow",
]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true
